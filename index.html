<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eventos</title>
    
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="hero">
        <h1 class="hero-titulo">Crie e compartilhe<br>seu evento.</h1>
        <p class="hero-subtitulo">
            O primeiro passo é preencher esse<br>
            formulário de inscrição.
        </p>
    </header>

    <!-- FORMULÁRIO -->
    <main class="container">
        <form class="form-evento" action="#" method="post">

            <!-- SEÇÃO 1 -->
            <h2 class="secao-titulo">Informações do Evento</h2>

            <div class="campo">
                <input type="text" id="titulo" name="titulo" 
                       placeholder="Título do evento" required>
            </div>

            <div class="campo">
                <input type="url" id="link" name="link" 
                       placeholder="Link do evento">
            </div>

            <div class="campo">
                <input type="tel" id="whatsapp" name="whatsapp" 
                       placeholder="WhatsApp para contato" class="campo-erro">
            </div>

            <div class="campo">
                <textarea id="extras" name="extras" rows="4"
                          placeholder="Informações extras"></textarea>
            </div>

            <div class="campo">
                <select id="categoria" name="categoria" required>
                    <option value="">Categoria</option>
                    <option value="palestra">Palestra</option>
                    <option value="workshop">Workshop</option>
                    <option value="curso">Curso</option>
                </select>
            </div>

            <!-- SEÇÃO 2 -->
            <h2 class="secao-titulo">Privacidade</h2>

            <div class="campo">
                <input type="email" id="email" name="email" 
                       placeholder="E-mail do administrador" required>
            </div>

            <div class="campo">
                <input type="password" id="senha" name="senha" 
                       placeholder="Senha de acesso para os participantes">
            </div>

            <div class="campo-checkbox">
                <input type="checkbox" id="privado" name="privado">
                <label for="privado">Evento privado</label>
            </div>

            <!-- SEÇÃO 3 -->
            <h2 class="secao-titulo">Dia e hora</h2>

            <div class="linha-data">
                <div class="campo campo-data">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required>
                </div>
                <div class="campo campo-hora">
                    <label for="das">Das</label>
                    <input type="time" id="das" name="das" required>
                </div>
                <div class="campo campo-hora">
                    <label for="ate">Até</label>
                    <input type="time" id="ate" name="ate" required>
                </div>
            </div>

            <!-- BOTÃO -->
            <button type="submit" class="botao-enviar">Salvar evento</button>

        </form>
    </main>

</body>
</html>
